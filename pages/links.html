<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>links | Part Folio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comfortaa:wght@300..700&family=Gaegu:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/links.css">
</head>

<body>

  <!-- Sidebar: same markup as the other pages; aria-current is now on "links" -->
  <nav class="sidebar" aria-label="Main navigation">
    <ul>

      <li>
        <a class="nav-item" href="about.html" title="about">
          <img src="../assets/img/main%20page/about.png" alt="">
          <span class="nav-label">about</span>
        </a>
      </li>

      <li>
        <a class="nav-item" href="work.html" title="work">
          <img src="../assets/img/main%20page/work.png" alt="">
          <span class="nav-label">work</span>
        </a>
      </li>

      <li>
        <a class="nav-item" href="links.html" aria-current="page" title="links">
          <img src="../assets/img/main%20page/links.png" alt="">
          <span class="nav-label">links</span>
        </a>
      </li>

      <li>
        <a class="nav-item" href="faq.html" title="faq">
          <img src="../assets/img/main%20page/faq.png" alt="">
          <span class="nav-label">faq</span>
        </a>
      </li>

      <li>
        <a class="nav-item" href="contact.html" title="contact">
          <img src="../assets/img/main%20page/contact.png" alt="">
          <span class="nav-label">contact</span>
        </a>
      </li>

    </ul>
  </nav>

  <main class="links-page">

    <!-- Decorative frame from the Figma design -->
    <img
      class="page-frame"
      src="../assets/img/links/Frame.png"
      alt=""
      aria-hidden="true"
    >

    <header class="intro">
      <h1>useful links</h1>
      <p>
        A few places where you can explore more of my work, connect with me, or follow my journey.
      </p>
    </header>

    <!-- Without JavaScript the slides simply stack as a list; links.js adds the carousel behaviour.
         To add a profile: copy one <li class="slide"> (DOM order = carousel order). -->

    <section
      class="carousel"
      role="region"
      aria-roledescription="carousel"
      aria-label="Social profiles"
    >

      <div class="row">

        <button
          class="arrow arrow--prev"
          type="button"
          aria-label="Previous link"
        >
          <svg viewBox="0 0 37 46" aria-hidden="true" focusable="false">
            <path d="M29 8 8 23l21 15z"/>
          </svg>
        </button>

        <div class="art">

          <img
            class="bag"
            src="../assets/img/links/piping-bag.png"
            alt=""
          >

          <ul class="slides">

            <li class="slide is-active" style="--tilt: -4deg">
              <!-- TODO: put your real LinkedIn URL in href -->
              <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="slide-label">linkedin</span>

                <img
                  class="cake"
                  src="../assets/img/links/linkedIn.png"
                  alt=""
                >

                <span class="sr-only">(opens in a new tab)</span>
              </a>
            </li>

            <li class="slide" style="--tilt: -6deg">
              <!-- TODO: put your real Instagram URL in href -->
              <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="slide-label">instagram</span>

                <img
                  class="cake"
                  src="../assets/img/links/instagram.png"
                  alt=""
                >

                <span class="sr-only">(opens in a new tab)</span>
              </a>
            </li>

            <li class="slide" style="--tilt: -5deg">
              <a
                href="https://www.behance.net/DouaaGhofraneB"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="slide-label">behance</span>

                <img
                  class="cake"
                  src="../assets/img/links/behance.png"
                  alt=""
                >

                <span class="sr-only">(opens in a new tab)</span>
              </a>
            </li>

          </ul>

          <div class="hint" aria-hidden="false">
            <img
              class="hint-arrow"
              src="../assets/img/links/click_to_scroll.png"
              alt=""
            >
          </div>

        </div>

        <button
          class="arrow arrow--next"
          type="button"
          aria-label="Next link"
        >
          <svg viewBox="0 0 37 46" aria-hidden="true" focusable="false">
            <path d="M29 8 8 23l21 15z"/>
          </svg>
        </button>

      </div>

      <!-- Announces "linkedin, 1 of 3" to screen readers when the slide changes -->
      <p class="sr-only" role="status" aria-live="polite"></p>

    </section>

  </main>

  <script src="../js/links.js" defer></script>

</body>
</html>
