<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../css/contact.css">
</head>

<body>

  <!-- Sidebar: same markup as the other pages; aria-current is now on "contact" -->
  <nav class="sidebar" aria-label="Main navigation">
    <ul>
      <li>
        <a class="nav-item" href="about.html" title="about">
          <img src="../assets/img/main%20page/about.png" alt="">
          <span class="nav-label">about</span>
        </a>
      </li>
      <li>
        <a class="nav-item" href="work.html" title="work">
          <img src="../assets/img/main%20page/work.png" alt="">
          <span class="nav-label">work</span>
        </a>
      </li>
      <li>
        <a class="nav-item" href="links.html" title="links">
          <img src="../assets/img/main%20page/links.png" alt="">
          <span class="nav-label">links</span>
        </a>
      </li>
      <li>
        <a class="nav-item" href="faq.html" title="faq">
          <img src="../assets/img/main%20page/faq.png" alt="">
          <span class="nav-label">faq</span>
        </a>
      </li>
      <li>
        <a class="nav-item" href="contact.html" aria-current="page" title="contact">
          <img src="../assets/img/main%20page/contact.png" alt="">
          <span class="nav-label">contact</span>
        </a>
      </li>
    </ul>
  </nav>

  <main class="contact-page">

    <header class="intro">
      <h1>let’s connect</h1>
      <p>Have a project in mind or want to collaborate? I’d love to hear your ideas.</p>
    </header>

    <div class="contact-grid">

      <!-- The dashed route is a PNG, and a PNG cannot be "drawn" the way an SVG stroke can.
           So the PNG is revealed through a mask: a thick invisible stroke that follows the
           arrow's centre-line and grows from its start to its end (see contact.css).
           To check the alignment, add class="debug" to this <svg>: the mask path shows in red. -->
      <svg class="route" viewBox="0 0 740 562" aria-hidden="true" focusable="false">
        <defs>
          <path id="route-path" pathLength="1" d="M1 3 L23 1 L48 5 L71 19 L86 45 L95 85 L99 130 L97 175 L89 215 L81 255 L73 295 L70 335 L74 380 L88 420 L113 455 L148 487 L188 503 L223 506 L258 498 L293 479 L328 453 L363 420 L395 380 L418 335 L426 285 L413 245 L383 224 L355 220 L323 231 L295 255 L275 295 L266 340 L267 380 L281 420 L308 460 L348 490 L403 515 L463 529 L523 531 L583 518 L633 503 L673 496 L708 505 L730 527 L737 557"/>
          <mask id="route-reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="740" height="562">
            <use class="route-reveal" href="#route-path"/>
          </mask>
        </defs>
        <image href="../assets/img/contact/arrow.png" x="0" y="0" width="740" height="562"
               preserveAspectRatio="none" mask="url(#route-reveal)"/>
        <use class="route-debug" href="#route-path"/>
      </svg>

      <!-- Left: contact details -->
      <div class="info">
        <div class="cards">
          <img class="delivery" src="../assets/img/contact/delivery-man.png" alt="">

          <article class="card">
            <h2>email</h2>
            <a href="mailto:dg.bendjemaa@esi-sba.dz">dg.bendjemaa@esi-sba.dz</a>
          </article>

          <article class="card">
            <h2>linkedin</h2>
            <!-- TODO: put your real LinkedIn URL in href -->
            <a href="#" target="_blank" rel="noopener noreferrer">connect on linkedin<span class="sr-only"> (opens in a new tab)</span></a>
          </article>

          <article class="card">
            <h2>location</h2>
            <p>Algiers, Algeria</p>
          </article>
        </div>

        <div class="follow">
          <h2>follow</h2>
          <ul class="social">
            <li>
              <a href="https://www.behance.net/DouaaGhofraneB" target="_blank" rel="noopener noreferrer" aria-label="Behance profile (opens in a new tab)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4"/><path d="M13 4h7v7M20 4l-9 9"/></svg>
              </a>
            </li>
            <li>
              <!-- TODO: same LinkedIn URL as above -->
              <a href="#" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile (opens in a new tab)">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M4.5 9h3.2v10.5H4.5zM6.1 4.3a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8zM10 9h3v1.4c.5-.9 1.6-1.7 3.2-1.7 3.2 0 3.8 2.1 3.8 4.8v6H17v-5.3c0-1.3 0-2.9-1.8-2.9s-2 1.4-2 2.8v5.4H10z"/></svg>
              </a>
            </li>
          </ul>
        </div>
      </div>

      <!-- Right: form (contact.js turns the submit into a WhatsApp message) -->
      <form class="form" id="contact-form">
        <div class="field">
          <label for="name">name</label>
          <input id="name" name="name" type="text" placeholder="your name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">email</label>
          <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="phone">phone</label>
          <input id="phone" name="phone" type="tel" placeholder="+00 000 000 0000" autocomplete="tel">
        </div>
        <div class="field">
          <label for="subject">subject</label>
          <textarea id="subject" name="subject" rows="4" placeholder="tell me about your project…" required></textarea>
        </div>

        <div class="submit-wrap">
          <img class="house" src="../assets/img/contact/house.png" alt="">
          <button class="submit" type="submit">submit &amp; open WhatsApp</button>
        </div>
        <p class="form-status" role="status"></p>
      </form>

    </div>

    <!-- TODO: point this at the page you want to end on (index.html?) -->
    <div class="final">
      <a class="btn" href="../index.html">View final page</a>
    </div>

  </main>

  <script src="../js/contact.js" defer></script>
</body>
</html>
